# =============================================================================
# SonarQube / SonarCloud configuration
# =============================================================================
# This file configures static analysis for the React frontend. It is
# consumed by the `sonarsource/sonarqube-scan-action` (or sonar-scanner CLI)
# step in .github/workflows/security.yml.
#
# Required GitHub Secrets (see README "CI/CD Pipeline" section):
#   SONAR_TOKEN  - authentication token generated in SonarQube/SonarCloud
#   SONAR_HOST_URL - URL of your SonarQube server (omit/leave default for
#                    SonarCloud, which uses https://sonarcloud.io)
# =============================================================================

# Unique key identifying this project on the SonarQube/SonarCloud server.
# Replace with your organization's actual project key before first scan.
sonar.projectKey=frontend-devsecops-demo
sonar.projectName=Frontend DevSecOps Demo
sonar.projectVersion=1.0.0

# For SonarCloud only: the organization key from your SonarCloud account.
# Remove this line entirely when pointing at a self-hosted SonarQube server.
sonar.organization=your-sonarcloud-org

# Root directory of the source code to analyze.
sonar.sources=src

# Test file locations (adjust if you add a dedicated __tests__ directory).
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

# Exclude build artifacts, dependencies, and static assets from analysis.
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/public/**,**/*.test.js,**/*.test.jsx

# Language-specific settings.
sonar.sourceEncoding=UTF-8

# Point Sonar at the Istanbul/lcov coverage report so code coverage shows
# up alongside the security/quality findings (generated by `npm test -- --coverage`).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Report ESLint findings to Sonar as well, so both tools' results are
# visible in one place. Path matches the eslint-formatter output
# generated in the CI workflow.
sonar.eslint.reportPaths=eslint-report.json
